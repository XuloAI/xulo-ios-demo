name: XuloDemo
options:
  bundleIdPrefix: app.xulo
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  Xulo:
    url: https://github.com/XuloAI/xulo-ios-sdk
    from: 0.1.2
targets:
  XuloDemo:
    type: application
    platform: iOS
    sources:
      - path: XuloDemo
    dependencies:
      - package: Xulo
        product: Xulo
      - target: NotificationService
        embed: true
      - target: NotificationContent
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.xulo.demo
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: XuloDemo/Info.plist
        CODE_SIGN_ENTITLEMENTS: XuloDemo/XuloDemo.entitlements
    info:
      path: XuloDemo/Info.plist
      properties:
        CFBundleDisplayName: Xulo Demo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        XuloAppGroup: group.app.xulo.demo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: XuloDemo/XuloDemo.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.app.xulo.demo
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    dependencies:
      - package: Xulo
        product: XuloExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.xulo.demo.NotificationService
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Notification Service
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        XuloAppGroup: group.app.xulo.demo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.xulo.demo
  NotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationContent
    dependencies:
      - package: Xulo
        product: XuloExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.xulo.demo.NotificationContent
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NotificationContent/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationContent/NotificationContent.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: NotificationContent/Info.plist
      properties:
        CFBundleDisplayName: Notification Content
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        XuloAppGroup: group.app.xulo.demo
        UNNotificationExtensionCategory: xulo
        UNNotificationExtensionDefaultContentHidden: false
        UNNotificationExtensionInitialContentSizeRatio: 0.5
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
    entitlements:
      path: NotificationContent/NotificationContent.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.xulo.demo
schemes:
  XuloDemo:
    build:
      targets:
        XuloDemo: all
        NotificationService: all
        NotificationContent: all
    run:
      config: Debug
